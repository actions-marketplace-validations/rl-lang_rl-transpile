name: 'RL Transpile'
description: 'Transpile a .rl file to C with rlt (optionally compiled to a binary)'
author: 'MohamedGonem'

branding:
  icon: 'cpu'
  color: 'yellow'

inputs:
  version:
    description: 'RL version: latest, nightly, or vX.Y.Z (e.g. v2.3.0). Defaults to the latest stable release.'
    required: false
    default: 'latest'
  file:
    description: 'Path to the .rl source file (relative to calling repo root)'
    required: true
  output:
    description: 'Output .c path (defaults to FILE with its extension changed to .c)'
    required: false
    default: ''
  compile:
    description: 'Compile the emitted C to a binary (passes --compile to rlt)'
    required: false
    default: 'false'
  test:
    description: 'Emit the test-driver main instead of the program main (passes --test to rlt)'
    required: false
    default: 'false'
  opt:
    description: 'Optimization level forwarded to cc (e.g. 2 for -O2)'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Setup RL
      uses: rl-lang/rl-setup@main
      with:
        version: ${{ inputs.version }}
        binaries: rlt

    - name: Transpile
      shell: bash
      run: |
        ARGS=()
        [ -n "${{ inputs.output }}" ] && ARGS+=(--output "${{ inputs.output }}")
        [ "${{ inputs.compile }}" = "true" ] && ARGS+=(--compile)
        [ "${{ inputs.test }}" = "true" ] && ARGS+=(--test)
        [ -n "${{ inputs.opt }}" ] && ARGS+=(--opt "${{ inputs.opt }}")
        rlt "${{ inputs.file }}" --runtime "${ARGS[@]}"
